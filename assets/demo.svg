<text class="term r0" y="60"><tspan x="20.0" fill="#3fb950">$ </tspan><tspan x="34.7" fill="#e6edf3">basalt audit ./shop-api --deps</tspan></text><text class="term r1" y="82"><tspan x="20.0" fill="#8b949e">  recon: prioritizing 6 partitions by risk…</tspan></text><text class="term r2" y="104"><tspan x="20.0" fill="#8b949e">  audit [1/6] api/auth.py</tspan></text><text class="term r3" y="126"><tspan x="20.0" fill="#8b949e">  audit [4/6] package-lock.json</tspan></text><text class="term r4" y="148"><tspan x="20.0" fill="#8b949e">  audit [6/6] utils/validate.py</tspan></text><text class="term r5" y="170"><tspan x="20"> </tspan></text><text class="term r6" y="192"><tspan x="20.0" fill="#e6edf3">== Report ==</tspan></text><text class="term r7" y="214"><tspan x="20.0" fill="#d2a8ff">Verification funnel: </tspan><tspan x="174.3" fill="#e6edf3">41</tspan><tspan x="189.0" fill="#8b949e"> candidates → </tspan><tspan x="291.9" fill="#e6edf3">22</tspan><tspan x="306.6" fill="#8b949e"> rejected by judge → </tspan><tspan x="461.0" fill="#e6edf3">14</tspan><tspan x="475.7" fill="#8b949e"> not reproduced → </tspan><tspan x="608.0" fill="#3fb950">5 CONFIRMED </tspan><tspan x="696.2" fill="#3fb950">✓</tspan></text><text class="term r8" y="236"><tspan x="20.0" fill="#ff7b72">  ● </tspan><tspan x="49.4" fill="#ff7b72">CRITICAL  </tspan><tspan x="122.9" fill="#e6edf3">SQL injection in login()</tspan><tspan x="299.3" fill="#8b949e">      api/auth.py:42   </tspan><tspan x="468.3" fill="#3fb950">tool-proven</tspan></text><text class="term r9" y="258"><tspan x="20.0" fill="#ff7b72">  ● </tspan><tspan x="49.4" fill="#ff7b72">CRITICAL  </tspan><tspan x="122.9" fill="#e6edf3">Command injection (image resize)</tspan><tspan x="358.1" fill="#8b949e">  api/media.py:88  </tspan><tspan x="497.8" fill="#3fb950">tool-proven</tspan></text><text class="term r10" y="280"><tspan x="20.0" fill="#ffa657">  ● </tspan><tspan x="49.4" fill="#ffa657">HIGH      </tspan><tspan x="122.9" fill="#e6edf3">lodash 4.17