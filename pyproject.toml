[project]
name = "basalt-scan"
version = "0.1.1"
description = "A purple-team of AI agents that audits code security and proves findings by execution."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Arkessiah" }]
keywords = ["security", "sast", "audit", "ai-agents", "purple-team", "vulnerability", "osv", "cve"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
]

[project.urls]
Homepage = "https://github.com/Arkessiah/Basalt"
Repository = "https://github.com/Arkessiah/Basalt"
Issues = "https://github.com/Arkessiah/Basalt/issues"
Changelog = "https://github.com/Arkessiah/Basalt/blob/main/CHANGELOG.md"

[project.optional-dependencies]
claude = ["anthropic>=0.40"]
sandbox = ["docker>=7.1"]
doc = ["python-docx>=1.1", "weasyprint>=60"]   # informe Word + PDF (WeasyPrint necesita pango/cairo del sistema)
mcp = ["mcp>=1.2,<2"]                          # MCP server (basalt mcp-serve); uses the v1 API (mcp.server.fastmcp), broken on 2.x
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
basalt = "basalt.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/basalt"]

[tool.hatch.build.targets.sdist]
include = ["src/basalt", "config", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.ruff]
line-length = 110
target-version = "py311"
